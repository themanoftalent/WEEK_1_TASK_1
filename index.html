<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Page Website</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      background: #f7f7f7;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    header, section {
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 1rem;
    }
    h1, h2 {
      margin-top: 0;
    }
    ul {
      padding-left: 1.2rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Welcome to My One Page Website</h1>
      <p>A simple single-page site with key information.</p>
    </header>

    <section>
      <h2>About</h2>
      <p>This page is built as a compact one-page website layout.</p>
    </section>

    <section>
      <h2>Skills</h2>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Basic Web Design</li>
      </ul>
    </section>

    <section>
      <h2>Contact</h2>
      <p>Email: example@email.com</p>
    </section>
  </div>
</body>
</html>
